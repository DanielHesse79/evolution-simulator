<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evolution Simulator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="globe atlas-orb" aria-hidden="true"></span>
          <div>
            <h1>Evolution</h1>
            <small>a game of deep time</small>
          </div>
        </div>
        <div class="clock">
          <div class="clock-row"><span id="year">Year 0</span><span id="age">Age of Microbes</span></div>
          <div class="timebar" title="Four billion years, with short ecological episodes sampled within geological epochs"><div id="timefill"></div></div>
        </div>
        <div class="speed" id="speed"></div>
        <div class="energy" id="energy" title="Energy: spent on every intervention, regained with time"></div>
        <div class="goal" id="goal"></div>
        <details class="library-menu">
          <summary>📖 Library &amp; settings</summary>
          <div class="menu">
          <button id="btn-guide" title="Pictures of every species">📖 Field guide</button>
          <button id="btn-tree" title="The family tree of everything that ever lived">🌳 Tree of Life</button>
          <button id="btn-chapters" title="Narrated milestones and recordings" disabled>🎬 Chapters</button>
          <button id="btn-sound" title="Sound">🔊</button>
          <button id="btn-help" title="How to play">? How to play</button>
          <button id="btn-new" title="Abandon this world and start another">New world</button>
          </div>
        </details>
      </header>

      <aside id="left">
        <section class="panel">
          <h2>Powers</h2>
          <div id="powers"></div>
          <div id="powerhint"></div>
        </section>
        <details class="panel side-section">
          <summary>Air, Sun &amp; Sea</summary>
          <div id="atmos"></div>
        </details>
        <details class="panel side-section" open>
          <summary>World overview</summary>
          <div id="worldstats"></div>
        </details>
      </aside>

      <main id="center">
        <div class="atlas-heading"><span>THE LIVING ATLAS</span><span>Scroll to explore · Drag to travel</span></div>
        <div id="layers" aria-label="Map layers"></div>
        <div id="mapwrap">
          <canvas id="map"></canvas>
          <canvas id="overlay"></canvas>
          <div id="zoomctl">
            <button data-zoom="in" title="Zoom in (+ or mouse wheel)">＋</button>
            <button data-zoom="out" title="Zoom out (−)">－</button>
            <button data-zoom="reset" title="Whole world (0)">⌂</button>
          </div>
          <div id="legend"></div>
          <div id="zoomlevels">
            <button data-level="1" title="The whole planet (0)">🌍 World</button>
            <button data-level="3" title="A continent or a sea">🗺️ Region</button>
            <button data-level="6" title="Forests, grassland and herds">🌳 Landscape</button>
            <button data-level="11" title="Individual creatures">🔎 Close-up</button>
          </div>
          <div id="site"></div>
          <div id="tooltip"></div>
        </div>
        <section id="chronicle" class="panel">
          <div class="chronicle-head">
            <h2>Chronicle <span id="chronicle-count"></span></h2>
            <div class="chronicle-actions">
              <button id="chronicle-latest" hidden>Latest</button>
              <button id="chronicle-expand" aria-expanded="false">Expand</button>
              <button id="chronicle-collapse" aria-expanded="true" aria-controls="log">Hide</button>
            </div>
          </div>
          <div id="chronicle-filters" aria-label="Chronicle filter">
            <button data-log-filter="all" aria-pressed="true">All events</button>
            <button data-log-filter="major" aria-pressed="false">Turning points</button>
            <button data-log-filter="creations" aria-pressed="false">My creations</button>
          </div>
          <div id="log" role="region" aria-label="World history" tabindex="0"></div>
        </section>
      </main>

      <aside id="right">
        <section class="panel" id="species-panel">
          <h2>Life <span id="spcount"></span></h2>
          <div id="tabs"></div>
          <div class="species-tools">
            <input id="species-search" type="search" aria-label="Find a species" placeholder="Find a species…" />
            <button id="creations-filter" aria-pressed="false" title="Only show species you created">✦ Mine</button>
          </div>
          <div id="splist"></div>
        </section>
        <section class="panel" id="detail"></section>
      </aside>
    </div>
    <div id="tut-spot"></div>
    <div id="tut-box"></div>
    <div id="modal"></div>
    <div id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
